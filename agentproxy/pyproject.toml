[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentproxy"
version = "0.1.0"
description = "HTTP-layer LLM call tracking and observability via httpx interception"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.24.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/agentproxy"]
