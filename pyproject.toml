[project]
name = "agentopt"
version = "0.1.0"
description = "A package for agent efficiency optimization through model selection and evaluation for LangChain agents"
requires-python = ">=3.10,<=3.13"
dependencies = [
    "langchain>=1.0.0",
    "langchain-classic>=0.1.0",
    "langchain-community>=0.3.0",
    "ddgs>=9.0.0",
    "wikipedia>=1.4.0",
    "langchain-openai>=0.1.0",
    "langchain-anthropic>=0.1.0",
    "openai>=1.51.0",
    "anthropic>=0.32.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "ipython>=8.38.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]
crewai = [
    "crewai>=0.1.0",
    "crewai-tools>=0.1.0",
]
llamaindex = [
    "llama-index-core>=0.12.0",
    "llama-index-llms-openai>=0.3.0",
]
bayesian = [
    "torch>=2.0.0",
    "botorch>=0.10.0",
    "gpytorch>=1.11.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentopt"]

[tool.hatch.build.targets.sdist]
include = ["src/agentopt"]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]
