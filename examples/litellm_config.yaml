model_list:
  - model_name: gpt-4o
    litellm_params:
      model: openai/gpt-4o
      api_key: N/A

  - model_name: gpt-4o-mini
    litellm_params:
      model: openai/gpt-4o-mini
      api_key: N/A

  - model_name: gpt-4.1
    litellm_params:
      model: openai/gpt-4.1
      api_key: N/A

  - model_name: gpt-4.1-mini
    litellm_params:
      model: openai/gpt-4.1-mini
      api_key: N/A
  
  - model_name: gpt-5.1
    litellm_params:
      model: openai/gpt-5.1
      api_key: N/A

  - model_name: gpt-5.2
    litellm_params:
      model: openai/gpt-5.2
      api_key: N/A

  - model_name: o3-mini
    litellm_params:
      model: openai/o3-mini
      api_key: N/A

litellm_settings:
  # Enable caching (replaces agentopt's EvalCache)
  cache: true
  cache_params:
    type: "disk"
    ttl: 3600
    disk_cache_dir: ".cache/litellm"
  # Token usage logging via agentopt callback
  callbacks: token_logger.proxy_handler_instance
