[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentopt"
version = "0.3.0"
description = "Framework-agnostic LLM model selection optimizer for agents"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "httpx>=0.24.0",
]

[project.optional-dependencies]
bayesian = ["torch>=2.0.0", "botorch>=0.10.0", "gpytorch>=1.11.0"]
crewai = ["crewai"]
langgraph = ["langchain-openai<1", "langgraph"]
examples = ["ag2", "crewai", "langchain<1", "langchain-openai<1", "langgraph", "llama-index-core", "llama-index-llms-openai", "openai", "openai-agents", "python-dotenv"]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/agentopt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
