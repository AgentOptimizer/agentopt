site_name: AgentOpt
site_url: https://agentoptimizer.github.io/agentopt
site_description: Find the right LLM models for your AI agents
repo_url: https://github.com/AgentOptimizer/agentopt
repo_name: AgentOptimizer/agentopt

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.expand
    - content.code.copy
    - content.code.annotate
  icon:
    repo: fontawesome/brands/github

nav:
  - Home: index.md
  - Getting Started:
    - Installation: getting-started/installation.md
    - Quick Start: getting-started/quickstart.md
  - Concepts:
    - How It Works: concepts/how-it-works.md
    - Selection Algorithms: concepts/algorithms.md
    - Response Caching: concepts/caching.md
  - Examples:
    - OpenAI SDK: examples/openai.md
    - LangChain: examples/langchain.md
    - CrewAI: examples/crewai.md
    - LlamaIndex: examples/llamaindex.md
  - API Reference:
    - Selectors: api/selectors.md
    - Results: api/results.md
    - Tracker: api/tracker.md

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - toc:
      permalink: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_source: false
            show_root_heading: true
            heading_level: 3
