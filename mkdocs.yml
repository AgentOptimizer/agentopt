site_name: AgentOpt
site_url: https://agentoptimizer.github.io/agentopt
site_description: Find the right LLM models for your AI agents
repo_url: https://github.com/AgentOptimizer/agentopt
repo_name: AgentOptimizer/agentopt

theme:
  name: material
  custom_dir: docs/overrides
  palette:
    - scheme: slate
      primary: custom
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - scheme: default
      primary: white
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  font:
    text: DM Sans
    code: DM Mono
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.instant
    - navigation.instant.progress
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - search.suggest
    - search.highlight
    - toc.follow
  logo: assets/logo-icon-transparent.png
  favicon: assets/logo-icon-transparent.png
  icon:
    repo: fontawesome/brands/github

nav:
  - Home: index.md
  - Getting Started:
    - Installation: getting-started/installation.md
    - Quick Start: getting-started/quickstart.md
  - Concepts:
    - How It Works: concepts/how-it-works.md
    - Selection Algorithms: concepts/algorithms.md
    - Parallel Evaluation: concepts/parallelism.md
    - Response Caching: concepts/caching.md
  - Examples:
    - OpenAI SDK: examples/openai.md
    - LangChain: examples/langchain.md
    - CrewAI: examples/crewai.md
    - LlamaIndex: examples/llamaindex.md
  - API Reference:
    - Selectors: api/selectors.md
    - Results: api/results.md
    - Tracker: api/tracker.md
  - Blog: blog/index.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/AgentOptimizer/agentopt
  generator: false

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/hero.js

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.mark
  - pymdownx.critic
  - pymdownx.keys
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - def_list
  - footnotes
  - toc:
      permalink: true

plugins:
  - search
  - blog:
      blog_dir: blog
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_source: false
            show_root_heading: true
            heading_level: 3
